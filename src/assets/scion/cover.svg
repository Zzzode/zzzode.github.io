<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400" fill="none" font-family="var(--font-sans)">
<rect x="0" y="0" width="460" height="400" rx="28" fill="var(--color-paper)" />
<text x="24" y="36" font-size="21" fill="var(--color-ink)" font-weight="600" text-anchor="start">Scion · 两个不同的动作</text>
<g data-ref-state="saved">
<text x="24" y="80" font-size="20" fill="var(--color-ink)" font-weight="600" text-anchor="start">① 创建变更</text>
<path d="M96 130H334" stroke="var(--color-muted-2)" stroke-width="2.5" stroke-linecap="round" fill="none" data-edge="A-B" />
<path d="M80 104V114" stroke="var(--color-muted-2)" stroke-width="2.5" stroke-linecap="round" fill="none" />
<g data-commit="A"><circle cx="80" cy="130" r="14" fill="var(--color-white)" stroke="var(--color-ink-2)" stroke-width="2" /><circle cx="80" cy="130" r="4" fill="var(--color-blue)" /></g>
<g data-commit="B"><circle cx="350" cy="130" r="14" fill="var(--color-white)" stroke="var(--color-ink-2)" stroke-width="2" /></g>
<text x="80" y="100" font-size="18" fill="var(--color-muted)" font-weight="500" text-anchor="middle" font-family="var(--font-mono)">main</text>
<text x="80" y="170" font-size="20" fill="var(--color-ink-2)" font-weight="500" text-anchor="middle">A · 欢迎</text>
<text x="350" y="170" font-size="20" fill="var(--color-ink-2)" font-weight="500" text-anchor="middle">B · 你好</text>
<text x="24" y="206" font-size="18" fill="var(--color-muted)" font-weight="400" text-anchor="start">已有 B，主线仍停在 A。</text>
</g>
<g data-ref-state="landed">
<text x="24" y="250" font-size="20" fill="var(--color-ink)" font-weight="600" text-anchor="start">② 合入以后</text>
<path d="M96 310H334" stroke="var(--color-muted-2)" stroke-width="2.5" stroke-linecap="round" fill="none" data-edge="A-B" />
<path d="M350 284V294" stroke="var(--color-muted-2)" stroke-width="2.5" stroke-linecap="round" fill="none" />
<g data-commit="A"><circle cx="80" cy="310" r="14" fill="var(--color-white)" stroke="var(--color-ink-2)" stroke-width="2" /></g>
<g data-commit="B"><circle cx="350" cy="310" r="14" fill="var(--color-white)" stroke="var(--color-ink-2)" stroke-width="2" /><circle cx="350" cy="310" r="4" fill="var(--color-blue)" /></g>
<text x="350" y="280" font-size="18" fill="var(--color-muted)" font-weight="500" text-anchor="middle" font-family="var(--font-mono)">main</text>
<text x="80" y="350" font-size="20" fill="var(--color-ink-2)" font-weight="500" text-anchor="middle">A · 欢迎</text>
<text x="350" y="350" font-size="20" fill="var(--color-ink-2)" font-weight="500" text-anchor="middle">B · 你好</text>
<text x="24" y="385" font-size="18" fill="var(--color-muted)" font-weight="400" text-anchor="start">主线前移，旧版本依然保留。</text>
</g>
</svg>
