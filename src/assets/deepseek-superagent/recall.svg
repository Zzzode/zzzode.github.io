<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" fill="none" font-family="var(--font-sans)">
  <defs>
    <marker id="recall-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--color-muted-2)"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="17" font-weight="600" fill="var(--color-ink)">窗口内的线索，窗口外的记录</text>
  <text x="24" y="52" font-size="12" fill="var(--color-muted)">模型沿引用逐级读取，每次读取仍受范围检查。</text>

  <rect x="24" y="76" width="300" height="212" rx="18" fill="var(--color-paper)"/>
  <text x="40" y="102" font-size="12.5" font-weight="600" fill="var(--color-ink)">模型窗口 · Inline</text>
  <rect x="40" y="114" width="268" height="42" rx="10" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="52" y="132" font-size="11.5" font-weight="600" fill="var(--color-ink)">近期消息 × 3</text>
  <text x="52" y="147" font-size="10.5" fill="var(--color-muted)">最近线索直接留在窗口</text>
  <rect x="40" y="164" width="268" height="42" rx="10" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="52" y="182" font-size="11.5" font-weight="600" fill="var(--color-ink)">工单卡：范围 / 状态</text>
  <text x="52" y="197" font-size="10.5" fill="var(--color-muted)">由 orchestrator_read 返回</text>
  <rect x="40" y="214" width="268" height="42" rx="10" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="52" y="232" font-size="11.5" font-weight="600" fill="var(--color-ink)">引用 ID</text>
  <text x="52" y="247" font-size="10.5" fill="var(--color-muted)">trigger/… · thread/… · ticket/…</text>
  <text x="40" y="274" font-size="10.5" fill="var(--color-muted)">装不下时，只保留续读入口。</text>

  <line x1="346" y1="90" x2="346" y2="286" stroke="var(--color-muted-2)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="314" y="210" width="64" height="22" rx="11" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="346" y="225" font-size="10.5" fill="var(--color-muted)" text-anchor="middle">权限校验</text>

  <rect x="368" y="76" width="368" height="212" rx="18" fill="var(--color-paper)"/>
  <text x="384" y="102" font-size="12.5" font-weight="600" fill="var(--color-ink)">窗口之外 · Spill</text>
  <rect x="384" y="114" width="336" height="38" rx="10" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="396" y="138" font-size="11.5" font-family="var(--font-mono)" fill="var(--color-ink)">trigger/&lt;id&gt;</text>
  <text x="708" y="138" font-size="10.5" fill="var(--color-muted)" text-anchor="end">当前消息与相邻背景</text>
  <rect x="384" y="160" width="336" height="38" rx="10" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="396" y="184" font-size="11.5" font-family="var(--font-mono)" fill="var(--color-ink)">thread/&lt;key&gt;</text>
  <text x="708" y="184" font-size="10.5" fill="var(--color-muted)" text-anchor="end">讨论串、工单与决定</text>
  <rect x="384" y="206" width="336" height="38" rx="10" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="396" y="230" font-size="11.5" font-family="var(--font-mono)" fill="var(--color-ink)">ticket/&lt;id&gt;/result</text>
  <text x="708" y="230" font-size="10.5" fill="var(--color-muted)" text-anchor="end">最近一次报告</text>
  <rect x="384" y="252" width="336" height="38" rx="10" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="396" y="276" font-size="11.5" font-family="var(--font-mono)" fill="var(--color-ink)">ticket/&lt;id&gt;/transcript</text>
  <text x="708" y="276" font-size="10.5" fill="var(--color-muted)" text-anchor="end">完整会话记录 · 分页</text>

  <path d="M308 235 H366" stroke="var(--color-muted-2)" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#recall-arrow)"/>

  <text x="346" y="306" font-size="10.5" fill="var(--color-muted)" text-anchor="middle">按引用读取</text>
  <text x="24" y="334" font-size="11.5" fill="var(--color-muted)">链式召回：消息 → 讨论串 → 工单 → 报告或会话记录，不需要先对全部文档做向量检索。</text>
</svg>
