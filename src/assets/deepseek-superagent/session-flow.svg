<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" fill="none" font-family="var(--font-sans)">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--color-muted-2)"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="17" font-weight="600" fill="var(--color-ink)">Harness 的一次请求：消息经过谁</text>
  <text x="24" y="52" font-size="11.5" fill="var(--color-muted)">Session 之间不直连；Engine 负责存储、授权、去重与转发。</text>

  <rect x="24" y="64" width="92" height="42" rx="10" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="70" y="82" font-size="11.5" font-weight="600" fill="var(--color-ink)" text-anchor="middle">人 / 平台</text>
  <text x="70" y="97" font-size="10.5" fill="var(--color-muted)" text-anchor="middle">群聊 · Issue · PR</text>

  <rect x="164" y="64" width="92" height="42" rx="10" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="210" y="82" font-size="11.5" font-weight="600" fill="var(--color-ink)" text-anchor="middle">Source</text>
  <text x="210" y="97" font-size="10.5" fill="var(--color-muted)" text-anchor="middle">GitHub · 飞书</text>

  <rect x="304" y="64" width="92" height="42" rx="10" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="350" y="82" font-size="11.5" font-weight="600" fill="var(--color-ink)" text-anchor="middle">Engine</text>
  <text x="350" y="97" font-size="10.5" fill="var(--color-muted)" text-anchor="middle">存储 · 授权</text>

  <rect x="444" y="64" width="92" height="42" rx="10" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="490" y="82" font-size="11.5" font-weight="600" fill="var(--color-ink)" text-anchor="middle">Main Session</text>
  <text x="490" y="97" font-size="10.5" fill="var(--color-muted)" text-anchor="middle">每个部署一个</text>

  <rect x="584" y="64" width="92" height="42" rx="10" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="630" y="82" font-size="11.5" font-weight="600" fill="var(--color-ink)" text-anchor="middle">Worker Session</text>
  <text x="630" y="97" font-size="10.5" fill="var(--color-muted)" text-anchor="middle">每个工单一个</text>

  <path d="M70 106 V410" stroke="var(--color-line)" stroke-dasharray="3 4"/>
  <path d="M210 106 V410" stroke="var(--color-line)" stroke-dasharray="3 4"/>
  <path d="M350 106 V410" stroke="var(--color-line)" stroke-dasharray="3 4"/>
  <path d="M490 106 V410" stroke="var(--color-line)" stroke-dasharray="3 4"/>
  <path d="M630 106 V410" stroke="var(--color-line)" stroke-dasharray="3 4"/>

  <path d="M70 128 H206" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#flow-arrow)"/>
  <text x="138" y="122" font-size="10.5" fill="var(--color-muted)" text-anchor="middle">请求 / 评论</text>

  <path d="M210 158 H346" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#flow-arrow)"/>
  <text x="278" y="152" font-size="10.5" fill="var(--color-muted)" text-anchor="middle">Trigger</text>

  <path d="M350 188 H486" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#flow-arrow)"/>
  <text x="418" y="182" font-size="10.5" fill="var(--color-muted)" text-anchor="middle">候选卡</text>

  <path d="M490 218 H354" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#flow-arrow)"/>
  <text x="422" y="212" font-size="10.5" fill="var(--color-muted)" text-anchor="middle">Decision</text>

  <path d="M350 248 H626" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#flow-arrow)"/>
  <text x="560" y="242" font-size="10.5" fill="var(--color-muted)" text-anchor="middle">Assignment / Input</text>

  <path d="M630 278 H354" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#flow-arrow)"/>
  <text x="560" y="272" font-size="10.5" fill="var(--color-muted)" text-anchor="middle">ack / report</text>

  <path d="M350 308 H486" stroke="var(--color-muted-2)" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#flow-arrow)"/>
  <text x="418" y="302" font-size="10.5" fill="var(--color-muted)" text-anchor="middle">报告 / 问题 / 通知</text>

  <path d="M490 338 H354" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#flow-arrow)"/>
  <text x="422" y="332" font-size="10.5" fill="var(--color-muted)" text-anchor="middle">reply</text>

  <path d="M350 368 H214" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#flow-arrow)"/>
  <text x="282" y="362" font-size="10.5" fill="var(--color-muted)" text-anchor="middle">发送</text>

  <path d="M210 398 H74" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#flow-arrow)"/>
  <text x="142" y="392" font-size="10.5" fill="var(--color-muted)" text-anchor="middle">回到原讨论</text>

  <text x="24" y="440" font-size="10.5" fill="var(--color-muted)">Worker 子 Agent 只在 Worker 的 Session 树内通信，结果回到 Worker；常规进展留在工单上；跨实例 A2A 仍属设计。</text>
</svg>
