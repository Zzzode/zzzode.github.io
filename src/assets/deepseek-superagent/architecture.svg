<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" fill="none" font-family="var(--font-sans)">
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--color-muted-2)"/>
    </marker>
  </defs>

  <text x="24" y="26" font-size="12" font-weight="600" fill="var(--color-muted)">主会话 · 只做评估与分派</text>
  <rect x="12" y="40" width="736" height="144" rx="18" fill="var(--color-paper)"/>

  <rect x="28" y="64" width="100" height="76" rx="12" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="38" y="92" font-size="13" font-weight="600" fill="var(--color-ink)">Source</text>
  <text x="38" y="112" font-size="10.5" fill="var(--color-muted)">GitHub · 飞书</text>
  <text x="38" y="128" font-size="10.5" fill="var(--color-muted)">读取位置</text>

  <rect x="150" y="64" width="100" height="76" rx="12" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="160" y="92" font-size="13" font-weight="600" fill="var(--color-ink)">Trigger</text>
  <text x="160" y="112" font-size="10.5" fill="var(--color-muted)">不可变事件</text>
  <text x="160" y="128" font-size="10.5" fill="var(--color-muted)">去重 · 审计</text>

  <rect x="272" y="64" width="100" height="76" rx="12" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="282" y="92" font-size="13" font-weight="600" fill="var(--color-ink)">Thread</text>
  <text x="282" y="112" font-size="10.5" fill="var(--color-muted)">相关讨论串</text>
  <text x="282" y="128" font-size="10.5" fill="var(--color-muted)">订阅 · 决定记录</text>

  <rect x="394" y="64" width="100" height="76" rx="12" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="404" y="92" font-size="13" font-weight="600" fill="var(--color-ink)">Eval</text>
  <text x="404" y="112" font-size="10.5" fill="var(--color-muted)">准入 + 研判</text>
  <text x="404" y="128" font-size="10.5" fill="var(--color-muted)">批量评估</text>

  <rect x="516" y="64" width="100" height="76" rx="12" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="526" y="92" font-size="13" font-weight="600" fill="var(--color-ink)">Decision</text>
  <text x="526" y="112" font-size="10.5" fill="var(--color-muted)">接单 · 停止</text>
  <text x="526" y="128" font-size="10.5" fill="var(--color-muted)">忽略 · 未完成</text>

  <rect x="638" y="64" width="100" height="76" rx="12" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="648" y="92" font-size="13" font-weight="600" fill="var(--color-ink)">Ticket</text>
  <text x="648" y="112" font-size="10.5" fill="var(--color-muted)">获准的工作</text>
  <text x="648" y="128" font-size="10.5" fill="var(--color-muted)">带 Mandate</text>
  <text x="648" y="164" font-size="10.5" fill="var(--color-muted)">范围 + 策略版本</text>

  <path d="M128 102 H146" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
  <path d="M250 102 H268" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
  <path d="M372 102 H390" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
  <path d="M494 102 H512" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
  <path d="M616 102 H634" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#arch-arrow)"/>

  <path d="M322 64 C420 24 590 24 688 64" stroke="var(--color-muted-2)" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arch-arrow)"/>
  <text x="505" y="22" font-size="10.5" fill="var(--color-muted)" text-anchor="middle">订阅扇出 · 后续消息</text>

  <text x="24" y="216" font-size="12" font-weight="600" fill="var(--color-muted)">执行器 · 在自己的目录里完成工单</text>
  <rect x="12" y="230" width="736" height="136" rx="18" fill="var(--color-paper)"/>

  <rect x="596" y="250" width="140" height="84" rx="12" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="608" y="278" font-size="13" font-weight="600" fill="var(--color-ink)">Assignment</text>
  <text x="608" y="298" font-size="10.5" fill="var(--color-muted)">派工关系</text>
  <text x="608" y="314" font-size="10.5" fill="var(--color-muted)">pending · running</text>
  <text x="608" y="330" font-size="10.5" fill="var(--color-muted)">ended</text>

  <rect x="396" y="250" width="178" height="84" rx="12" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="408" y="278" font-size="13" font-weight="600" fill="var(--color-ink)">Executor Session</text>
  <text x="408" y="298" font-size="10.5" fill="var(--color-muted)">worker 与独立目录</text>
  <text x="408" y="314" font-size="10.5" fill="var(--color-muted)">shell 超过 5 秒转后台</text>

  <rect x="216" y="250" width="158" height="84" rx="12" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="228" y="278" font-size="13" font-weight="600" fill="var(--color-ink)">Report</text>
  <text x="228" y="298" font-size="10.5" fill="var(--color-muted)">progress · waiting</text>
  <text x="228" y="314" font-size="10.5" fill="var(--color-muted)">ready · blocked</text>
  <text x="228" y="330" font-size="10.5" fill="var(--color-muted)">failed · dropped</text>

  <rect x="28" y="250" width="166" height="84" rx="12" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="40" y="278" font-size="13" font-weight="600" fill="var(--color-ink)">Channel</text>
  <text x="40" y="298" font-size="10.5" fill="var(--color-muted)">回复到原讨论</text>
  <text x="40" y="314" font-size="10.5" fill="var(--color-muted)">群聊 · PR 评论</text>

  <path d="M594 292 H578" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
  <path d="M394 292 H378" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
  <path d="M688 140 V246" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
  <text x="678" y="198" font-size="10.5" fill="var(--color-muted)" text-anchor="end">派工</text>
  <path d="M28 292 H10 Q6 292 6 288 V106 Q6 102 10 102 H26" stroke="var(--color-muted-2)" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arch-arrow)"/>

  <text x="24" y="390" font-size="11.5" fill="var(--color-muted)">工单、授权与派工分开保存；重启后仍能接回任务。</text>
</svg>
