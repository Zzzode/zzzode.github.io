  <text x="334" y="203" font-size="11.5" fill="var(--color-muted)">Worker 执行中</text>
  <text x="334" y="219" font-size="10.5" fill="var(--color-muted-2)">并列推进</text>

  <rect x="24" y="230" width="134" height="60" rx="14" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="38" y="256" font-size="15" font-weight="600" fill="var(--color-ink)">后续评论</text>
  <text x="38" y="276" font-size="11.5" fill="var(--color-muted)">CI 失败 · 评审意见</text>
  <path d="M158 260 C230 260 300 200 376 144" stroke="var(--color-muted-2)" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#cover-arrow)"/>
  <text x="244" y="212" font-size="11" fill="var(--color-muted)" text-anchor="middle">订阅直达</text>

  <text x="24" y="334" font-size="13" fill="var(--color-muted)">会话停下，工单、授权与订阅仍然保留。</text>
