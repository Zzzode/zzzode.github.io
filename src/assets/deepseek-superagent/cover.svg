  <text x="38" y="141" font-size="11.5" fill="var(--color-muted)">群聊 · Issue · PR</text>
  <path d="M146 126 H176" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#cover-arrow)"/>

  <rect x="178" y="82" width="108" height="88" rx="18" fill="var(--color-white)" stroke="var(--color-line)"/>
