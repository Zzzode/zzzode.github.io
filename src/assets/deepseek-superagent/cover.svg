  <text x="232" y="154" font-size="11" fill="var(--color-muted-2)" text-anchor="middle">常驻主会话</text>

  <path d="M286 106 H318" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#cover-arrow)"/>
  <path d="M286 146 C304 146 304 172 318 172" stroke="var(--color-muted-2)" stroke-width="1.5" marker-end="url(#cover-arrow)"/>

  <rect x="320" y="72" width="116" height="68" rx="14" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="334" y="99" font-size="15" font-weight="600" fill="var(--color-ink)">工单 A</text>
  <text x="334" y="119" font-size="11.5" fill="var(--color-muted)">Worker 执行中</text>
