<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" fill="none" font-family="var(--font-sans)">
  <defs>
    <marker id="isolation-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--color-muted-2)"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="17" font-weight="600" fill="var(--color-ink)">当前的执行隔离边界</text>
  <text x="24" y="52" font-size="12" fill="var(--color-muted)">公开原型以操作者身份运行；包装器不是隔离。</text>

  <rect x="24" y="76" width="460" height="200" rx="18" fill="var(--color-paper)" stroke="var(--color-line)"/>
  <text x="44" y="102" font-size="13" font-weight="600" fill="var(--color-ink)">操作者的系统账号</text>
  <text x="44" y="120" font-size="10.5" font-family="var(--font-mono)" fill="var(--color-muted)">danger-full-access · 命令以该用户运行</text>

  <rect x="44" y="132" width="204" height="54" rx="10" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="56" y="154" font-size="11.5" font-weight="600" fill="var(--color-ink)">Router / Worker 进程</text>
  <text x="56" y="172" font-size="10" fill="var(--color-muted)">可执行任意绝对路径程序</text>

  <rect x="264" y="132" width="200" height="54" rx="10" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="276" y="154" font-size="11.5" font-weight="600" fill="var(--color-ink)">工作树目录</text>
  <text x="276" y="172" font-size="10" fill="var(--color-muted)">只把代码目录分开</text>

  <rect x="44" y="202" width="204" height="54" rx="10" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="56" y="224" font-size="11.5" font-weight="600" fill="var(--color-ink)">CLI 包装器</text>
  <text x="56" y="242" font-size="10" fill="var(--color-muted)">默认使用 Agent 账号</text>

  <rect x="264" y="202" width="200" height="54" rx="10" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="276" y="224" font-size="11.5" font-weight="600" fill="var(--color-ink)">可读文件与凭据</text>
  <text x="276" y="242" font-size="10" fill="var(--color-muted)">包括该账号的主页目录</text>

  <text x="536" y="72" font-size="10" fill="var(--color-muted)">提示词注入风险</text>
  <rect x="536" y="84" width="200" height="52" rx="12" fill="var(--color-white)" stroke="var(--color-line-soft)"/>
  <text x="548" y="106" font-size="11.5" font-weight="600" fill="var(--color-ink)">评论 / 日志 / 文档</text>
  <text x="548" y="124" font-size="10" fill="var(--color-muted)">作为任务数据进入上下文</text>
  <path d="M536 110 H488" stroke="var(--color-muted-2)" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#isolation-arrow)"/>

  <rect x="536" y="170" width="200" height="106" rx="14" fill="var(--color-white)" stroke="var(--color-line)"/>
  <text x="548" y="194" font-size="11" font-weight="600" fill="var(--color-ink)">建议的边界</text>
  <text x="548" y="214" font-size="10.5" fill="var(--color-ink-2)">使用专用系统账号</text>
  <text x="548" y="232" font-size="10.5" fill="var(--color-ink-2)">账号只保存 Agent 凭据</text>
  <text x="548" y="250" font-size="10.5" fill="var(--color-ink-2)">执行器读不到秘密</text>
  <text x="548" y="268" font-size="10.5" fill="var(--color-ink-2)">强制评审写入分支保护</text>

</svg>
