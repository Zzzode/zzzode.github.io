  <path d="M94 458 V376" fill="none" stroke="var(--color-diagram-teal)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#async-visual-a-en-architecture-teal)" stroke-dasharray="4 5" />
