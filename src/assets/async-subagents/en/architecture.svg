<svg xmlns="http://www.w3.org/2000/svg" id="async-visual-a-en-architecture" width="480" viewBox="0 0 480 560" role="img" aria-label="The supervisor maintains records for both tasks and the runtime schedules both subagents and returns events" font-family="var(--font-sans)">
  <defs>
    <marker id="async-visual-a-en-architecture-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--color-blue)" /></marker>
    <marker id="async-visual-a-en-architecture-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--color-diagram-teal)" /></marker>
    <marker id="async-visual-a-en-architecture-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--color-diagram-purple)" /></marker>
    <marker id="async-visual-a-en-architecture-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--color-compare)" /></marker>
    <marker id="async-visual-a-en-architecture-muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--color-muted)" /></marker>
  </defs>
  <rect x="24" y="8" width="180" height="52" rx="26" fill="color-mix(in srgb, var(--color-compare) 10%, var(--color-white))" stroke="var(--color-compare)" stroke-width="1.8" />
  <circle cx="60" cy="34" r="13" fill="var(--color-compare)" />
  <text x="96" y="42" fill="var(--color-ink)" font-size="25" font-weight="600" text-anchor="start">User</text>
  <path d="M204 34 H246 V97" fill="none" stroke="var(--color-compare)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#async-visual-a-en-architecture-orange)" />
  <path d="M102 100 V64" fill="none" stroke="var(--color-blue)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#async-visual-a-en-architecture-blue)" />
  <rect x="24" y="100" width="270" height="118" rx="18" fill="color-mix(in srgb, var(--color-blue) 10%, var(--color-white))" stroke="var(--color-blue)" stroke-width="2" />
  <rect x="24" y="100" width="8" height="118" rx="4" fill="var(--color-blue)" />
  <text x="159" y="135" fill="var(--color-ink)" font-size="27" font-weight="600" text-anchor="middle">Supervisor</text>
  <text x="159" y="168" fill="var(--color-ink-2)" font-size="21" font-weight="400" text-anchor="middle">Understands</text>
  <text x="159" y="197" fill="var(--color-ink-2)" font-size="21" font-weight="400" text-anchor="middle">Synthesizes</text>
  <path d="M294 160 H310" fill="none" stroke="var(--color-diagram-purple)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="310" y="100" width="146" height="118" rx="16" fill="color-mix(in srgb, var(--color-diagram-purple) 10%, var(--color-white))" stroke="var(--color-diagram-purple)" stroke-width="1.8" />
  <text x="383" y="129" fill="var(--color-ink)" font-size="20" font-weight="600" text-anchor="middle">Task records</text>
