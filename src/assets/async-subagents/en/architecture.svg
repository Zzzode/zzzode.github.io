  <text x="118" y="519" fill="var(--color-ink)" font-size="22" font-weight="500" text-anchor="middle">Context &amp; tools</text>
  <rect x="264" y="460" width="188" height="83" rx="26" fill="color-mix(in srgb, var(--color-diagram-teal) 10%, var(--color-white))" stroke="var(--color-diagram-teal)" stroke-width="2" />
  <text x="358" y="491" fill="var(--color-ink)" font-size="22" font-weight="500" text-anchor="middle">Subagent B</text>
  <text x="358" y="519" fill="var(--color-ink)" font-size="22" font-weight="500" text-anchor="middle">Context &amp; tools</text>
