<svg xmlns="http://www.w3.org/2000/svg" id="async-variety-b-en-notification" width="100%" viewBox="0 0 400 392" role="img" aria-labelledby="async-variety-b-en-notification-title" style="font-family:var(--font-sans)"><title id="async-variety-b-en-notification-title">Completion or failure is delivered according to whether the supervisor is busy, idle, or awaiting approval.</title><defs><marker id="async-variety-b-en-notification-blue-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--color-blue)"/></marker><marker id="async-variety-b-en-notification-teal-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--color-diagram-teal)"/></marker><marker id="async-variety-b-en-notification-purple-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--color-diagram-purple)"/></marker><marker id="async-variety-b-en-notification-orange-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--color-compare)"/></marker></defs><rect x="20" y="16" width="360" height="58" rx="12" fill="color-mix(in srgb, var(--color-compare) 12%, var(--color-white))" stroke="var(--color-compare)" stroke-width="1.5"/><text x="200" y="52" text-anchor="middle" font-size="20" font-weight="600" fill="var(--color-ink)"><tspan x="200" dy="0">Task finished or failed</tspan></text><text x="30" y="111" text-anchor="start" font-size="18" font-weight="500" fill="var(--color-muted)"><tspan x="30" dy="0">Supervisor</tspan></text><text x="180" y="111" text-anchor="start" font-size="18" font-weight="500" fill="var(--color-muted)"><tspan x="180" dy="0">Delivery</tspan></text><path d="M20 126 H380" fill="none" stroke="var(--color-diagram-purple)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="137" width="360" height="72" rx="10" fill="color-mix(in srgb, var(--color-blue) 6%, var(--color-white))" stroke="none" stroke-width="1.5"/><circle cx="43" cy="173" r="11" fill="var(--color-blue)" stroke="var(--color-blue)" stroke-width="2"/><text x="105" y="179" text-anchor="middle" font-size="18" font-weight="600" fill="var(--color-blue)"><tspan x="105" dy="0">Busy</tspan></text><path d="M153 173 H174" fill="none" stroke="var(--color-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#async-variety-b-en-notification-blue-arrow)"/><text x="190" y="166" text-anchor="start" font-size="18" font-weight="400" fill="var(--color-ink-2)"><tspan x="190" dy="0">Before next</tspan><tspan x="190" dy="23">model call</tspan></text><rect x="20" y="219" width="360" height="72" rx="10" fill="color-mix(in srgb, var(--color-blue) 6%, var(--color-white))" stroke="none" stroke-width="1.5"/><circle cx="43" cy="255" r="11" fill="var(--color-white)" stroke="var(--color-blue)" stroke-width="2"/><text x="105" y="261" text-anchor="middle" font-size="18" font-weight="600" fill="var(--color-blue)"><tspan x="105" dy="0">Idle</tspan></text><path d="M153 255 H174" fill="none" stroke="var(--color-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#async-variety-b-en-notification-blue-arrow)"/><text x="190" y="248" text-anchor="start" font-size="18" font-weight="400" fill="var(--color-ink-2)"><tspan x="190" dy="0">Wake if eligible</tspan><tspan x="190" dy="23">Start a new run</tspan></text><rect x="20" y="301" width="360" height="72" rx="10" fill="color-mix(in srgb, var(--color-compare) 6%, var(--color-white))" stroke="none" stroke-width="1.5"/><path d="M43 323 L55 337 L43 351 L31 337 Z" fill="color-mix(in srgb, var(--color-compare) 20%, var(--color-white))" stroke="var(--color-compare)" stroke-width="1.5"/><text x="105" y="343" text-anchor="middle" font-size="18" font-weight="600" fill="color-mix(in srgb, var(--color-compare) 65%, var(--color-ink))"><tspan x="105" dy="0">Approval</tspan></text><path d="M153 337 H174" fill="none" stroke="var(--color-compare)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#async-variety-b-en-notification-orange-arrow)"/><text x="190" y="330" text-anchor="start" font-size="18" font-weight="400" fill="var(--color-ink-2)"><tspan x="190" dy="0">Preserve approval</tspan><tspan x="190" dy="23">Deliver later</tspan></text></svg>
