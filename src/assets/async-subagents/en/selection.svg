<svg xmlns="http://www.w3.org/2000/svg" id="async-color-en-selection" width="480" height="410" viewBox="0 0 480 410" role="img" aria-labelledby="async-color-en-selection-title" font-family="var(--font-sans)">
  <title id="async-color-en-selection-title">Choose collaboration according to the work</title>
