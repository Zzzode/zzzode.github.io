<svg xmlns="http://www.w3.org/2000/svg" id="async-variety-b-en-approval" width="100%" viewBox="0 0 400 455" role="img" aria-labelledby="async-variety-b-en-approval-title" style="font-family:var(--font-sans)"><title id="async-variety-b-en-approval-title">Task A waits for the user and resumes on its own thread while the supervisor and task B continue.</title><defs><marker id="async-variety-b-en-approval-blue-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--color-blue)"/></marker><marker id="async-variety-b-en-approval-teal-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--color-diagram-teal)"/></marker><marker id="async-variety-b-en-approval-purple-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--color-diagram-purple)"/></marker><marker id="async-variety-b-en-approval-orange-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--color-compare)"/></marker></defs><rect x="4" y="12" width="104" height="58" rx="8" fill="color-mix(in srgb, var(--color-blue) 10%, var(--color-white))" stroke="none" stroke-width="1.5"/><text x="56" y="37" letter-spacing="-0.2" text-anchor="middle" font-size="18" font-weight="600" fill="var(--color-blue)"><tspan x="56" dy="0">Supervisor</tspan><tspan x="56" dy="23">App</tspan></text><path d="M58 80 V395" fill="none" stroke="var(--color-blue)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><rect x="111.0" y="12" width="82" height="58" rx="8" fill="color-mix(in srgb, var(--color-diagram-teal) 10%, var(--color-white))" stroke="none" stroke-width="1.5"/><text x="152" y="48" text-anchor="middle" font-size="18" font-weight="600" fill="var(--color-diagram-teal)"><tspan x="152" dy="0">Task B</tspan></text><path d="M152 80 V395" fill="none" stroke="var(--color-diagram-teal)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><rect x="201.0" y="12" width="82" height="58" rx="8" fill="color-mix(in srgb, var(--color-diagram-teal) 10%, var(--color-white))" stroke="none" stroke-width="1.5"/><text x="242" y="48" text-anchor="middle" font-size="18" font-weight="600" fill="var(--color-diagram-teal)"><tspan x="242" dy="0">Task A</tspan></text><path d="M242 80 V395" fill="none" stroke="var(--color-diagram-teal)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><rect x="303.0" y="12" width="82" height="58" rx="8" fill="color-mix(in srgb, var(--color-compare) 10%, var(--color-white))" stroke="none" stroke-width="1.5"/><text x="344" y="48" text-anchor="middle" font-size="18" font-weight="600" fill="color-mix(in srgb, var(--color-compare) 65%, var(--color-ink))"><tspan x="344" dy="0">User</tspan></text><path d="M344 80 V395" fill="none" stroke="var(--color-compare)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><rect x="51" y="90" width="14" height="288" rx="6" fill="color-mix(in srgb, var(--color-blue) 20%, var(--color-white))" stroke="var(--color-blue)" stroke-width="1.5"/><rect x="145" y="90" width="14" height="288" rx="6" fill="color-mix(in srgb, var(--color-diagram-teal) 22%, var(--color-white))" stroke="var(--color-diagram-teal)" stroke-width="1.5"/><rect x="235" y="90" width="14" height="72" rx="6" fill="var(--color-diagram-teal)" stroke="none" stroke-width="1.5"/><rect x="234" y="164" width="16" height="126" rx="6" fill="color-mix(in srgb, var(--color-compare) 18%, var(--color-white))" stroke="var(--color-compare)" stroke-width="1.5"/><path d="M233 132 H67" fill="none" stroke="var(--color-compare)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#async-variety-b-en-approval-orange-arrow)"/><text x="149" y="116" text-anchor="middle" font-size="18" font-weight="500" fill="color-mix(in srgb, var(--color-compare) 65%, var(--color-ink))" paint-order="stroke" stroke="var(--color-white)" stroke-width="5" stroke-linejoin="round"><tspan x="149" dy="0">Approval needed</tspan></text><path d="M67 205 H335" fill="none" stroke="var(--color-compare)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#async-variety-b-en-approval-orange-arrow)"/><text x="201" y="189" text-anchor="middle" font-size="18" font-weight="500" fill="var(--color-ink-2)" paint-order="stroke" stroke="var(--color-white)" stroke-width="5" stroke-linejoin="round"><tspan x="201" dy="0">Show the request</tspan></text><rect x="206" y="223" width="72" height="32" rx="5" fill="var(--color-white)" stroke="none" stroke-width="1.5"/><text x="242" y="246" text-anchor="middle" font-size="18" font-weight="500" fill="color-mix(in srgb, var(--color-compare) 65%, var(--color-ink))"><tspan x="242" dy="0">Waiting</tspan></text><path d="M335 292 H251" fill="none" stroke="var(--color-compare)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#async-variety-b-en-approval-orange-arrow)"/><text x="300" y="278" text-anchor="middle" font-size="18" font-weight="500" fill="color-mix(in srgb, var(--color-compare) 65%, var(--color-ink))"><tspan x="300" dy="0">Decision</tspan></text><rect x="235" y="300" width="14" height="78" rx="6" fill="var(--color-diagram-teal)" stroke="none" stroke-width="1.5"/><text x="242" y="409" text-anchor="middle" font-size="18" font-weight="500" fill="var(--color-diagram-teal)"><tspan x="242" dy="0">Same thread</tspan><tspan x="242" dy="23">Resumes</tspan></text><text x="104" y="410" text-anchor="middle" font-size="18" font-weight="400" fill="var(--color-ink-2)"><tspan x="104" dy="0">Keep talking</tspan><tspan x="104" dy="23">Keep working</tspan></text></svg>
